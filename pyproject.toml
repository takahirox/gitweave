[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitweave"
version = "0.1.0"
description = "A Git-native graph runtime for AI agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
gitweave = "gitweave.cli:main"

[tool.setuptools.packages.find]
include = ["gitweave*"]
